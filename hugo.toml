baseURL = "http://localhost:1313/"
locale = "en-US"
title = "Nakul Khambhati"
enableRobotsTXT = true
capitalizeListTitles = false
# The Obsidian vault is content/. These parts of it never become pages.
ignoreFiles = ['content/drafts/', 'content/_templates/', 'content/attachments/']

[params]
  description = "Learning notes: cryptography, statistical learning, AI safety."
  # Set to true to ask search engines not to index the site (it stays public by URL).
  noindex = false

[taxonomies]
  tag = "tags"

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[markup.goldmark.extensions]
  footnote = true

[markup.highlight]
  noClasses = false
  style = "monokailight"

[menus]
  [[menus.main]]
    name = "Notes"
    pageRef = "/notes"
    weight = 1
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 2

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html"]

# Images pasted in Obsidian land in content/attachments/ and are served at /attachments/.
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "content/attachments"
  target = "static/attachments"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "data"
  target = "data"
