{{- range .GroupByDate "2006" }}
<h3 class="year">{{ .Key }}</h3>
<ul class="note-list">
  {{- range .Pages }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title | default .File.ContentBaseName }}</a>
    {{- if .Draft }} <span class="draft-flag">draft</span>{{ end }}
  </li>
  {{- end }}
</ul>
{{- end }}
